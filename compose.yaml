services:
  postgres:
    image: postgres:17-alpine@sha256:266d3c257594e195b309ae9d1805e54c788f1d7b375f56bf6c367aac6c917e7b
    environment:
      POSTGRES_USER: companion
      POSTGRES_PASSWORD: local_dev_only
      POSTGRES_DB: companion
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U companion -d companion']
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  postgres_data:
