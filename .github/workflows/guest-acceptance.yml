name: Real anonymous guest acceptance
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  guest-development:
    runs-on: ubuntu-latest
    environment: development
    env:
      NODE_ENV: test
      SUPABASE_URL: ${{ secrets.DEV_SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.DEV_SUPABASE_SECRET_KEY }}
      EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.DEV_SUPABASE_PUBLISHABLE_KEY }}
      AI_PROVIDER: deepseek
      AI_MODEL: ${{ vars.DEV_AI_MODEL || 'deepseek-chat' }}
      DEEPSEEK_API_KEY: ${{ secrets.DEV_DEEPSEEK_API_KEY }}
      MODERATION_PROVIDER: deepseek
      MODERATION_MODEL: ${{ vars.DEV_MODERATION_MODEL || 'deepseek-chat' }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Validate the development schema and private bucket before the paid smoke test.
      - run: pnpm test:integration
      # This manually invoked test makes one generation and two content checks.
      - run: pnpm test:guest-live
